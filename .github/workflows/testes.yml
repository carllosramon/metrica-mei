name: testes

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install -r requirements.txt

      - run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: verificar os tipos
        run: npx tsc -b

      - run: npm test

      - run: npm run build

  jornada:
    name: jornada de ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A jornada sobe backend e frontend de verdade, então precisa dos dois
      # ambientes no mesmo job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: instalar o backend
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: instalar o frontend
        run: npm ci
        working-directory: frontend

      - name: instalar o navegador
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend

      # O relatório só interessa quando algo quebra, e é ele que mostra em
      # que passo da jornada a falha aconteceu.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-da-jornada
          path: frontend/playwright-report/
          retention-days: 7
