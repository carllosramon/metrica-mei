name: testes

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install -r requirements.txt

      - run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: verificar o lint
        run: npm run lint

      - name: verificar os tipos
        run: npx tsc -b

      - run: npm test

      - run: npm run build

  jornada:
    name: jornada de ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A jornada sobe backend e frontend de verdade, então precisa dos dois
      # ambientes no mesmo job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: instalar o backend
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: instalar o frontend
        run: npm ci
        working-directory: frontend

      - name: instalar o navegador
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend

      # O relatório só interessa quando algo quebra, e é ele que mostra em
      # que passo da jornada a falha aconteceu.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-da-jornada
          path: frontend/playwright-report/
          retention-days: 7

  postgresql:
    name: PostgreSQL real
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metricamei_test
          POSTGRES_USER: metricamei
          POSTGRES_PASSWORD: metricamei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metricamei -d metricamei_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://metricamei:metricamei@localhost:5432/metricamei_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: instalar o backend
        run: python -m pip install -r requirements.txt

      - name: aplicar migrations no PostgreSQL
        run: python -m alembic upgrade head

      - name: verificar schema no PostgreSQL
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])

          inspector = inspect(engine)
          tables = set(inspector.get_table_names())

          assert {
              "usuarios",
              "conteudos",
              "metricas",
          }.issubset(tables)

          content_columns = {
              column["name"]
              for column in inspector.get_columns("conteudos")
          }

          assert "url_publicacao" in content_columns

          metric_columns = {
              column["name"]
              for column in inspector.get_columns("metricas")
          }

          assert "data_referencia" in metric_columns

          print("Schema PostgreSQL validado com sucesso.")
          PY
